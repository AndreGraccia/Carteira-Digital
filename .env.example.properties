# Copie este arquivo para .env.properties antes de executar.
# Preencha os valores localmente. Nunca publique senhas reais.

db_name=wallia
db_username=wallia
db_password=SUBSTITUA_PELA_SENHA_LOCAL
jwt_secret=SUBSTITUA_POR_UM_SEGREDO_ALEATORIO
frontend_origin=http://localhost:3001

# Portas locais. 8082 e 3001 fogem das 8080 e 3000 que outros projetos costumam ocupar (veja docs/guia-do-desenvolvedor.md).
# Mudou backend_port ou a porta do frontend? Ajuste frontend_origin e frontend/.env.local também.
db_port=5432
backend_port=8082
frontend_port=3001

# Opcional. Sem a chave, os relatórios usam a análise local determinística.
gemini_api_key=
gemini_model=gemini-3.8-flash
# Busca do Google nas respostas: desligada por padrão (não existe no plano gratuito e manda contexto para fora)
gemini_search_grounding=false

# Alerta diário por e-mail (só para quem ativou na tela Futuro). Padrão: 8h de Brasília. "-" desliga.
future_alert_cron=0 0 8 * * *

# Open Finance: contract-sandbox funciona sem credenciais externas.
# participant-sandbox exige credenciais emitidas para uma instituição participante.
open_finance_mode=contract-sandbox
open_finance_base_url=
open_finance_access_token=
open_finance_consent_id=
open_finance_institution_id=participant-sandbox
open_finance_key_store_path=
open_finance_key_store_password=
# participant-sandbox: id do único usuário Wall.ia dono do token e do consentimento acima
open_finance_owner_user_id=

# E-mail (código de confirmação do cadastro e alertas). Padrão: Mailpit local em localhost:1025.
mail_host=localhost
mail_port=1025
mail_username=
mail_password=
mail_auth=false
mail_starttls=false
mail_from=no-reply@wallia.local
# Validade do código (minutos), espera para reenviar (segundos) e tentativas antes de bloquear.
email_code_ttl_minutes=10
email_resend_cooldown_seconds=60
email_code_max_attempts=5

# Dados públicos do Banco Central (ADR 0010): busca diária às 6h e uma vez na subida se o banco estiver vazio. "-" desliga.
market_refresh_cron=0 0 6 * * *
market_refresh_on_startup=true

# Avisos no navegador (Web Push). Vazio desliga. Gere um par uma vez por ambiente e nao troque:
# os navegadores ficam inscritos nesta chave publica. Veja docs/guia-do-desenvolvedor.md.
vapid_public_key=
vapid_private_key=
vapid_subject=mailto:no-reply@wallia.local

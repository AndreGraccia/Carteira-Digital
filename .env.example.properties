# Copie este arquivo para .env.properties antes de executar.
# Preencha os valores localmente. Nunca publique senhas reais.

db_name=ewallet
db_username=ewallet
db_password=SUBSTITUA_PELA_SENHA_LOCAL
jwt_secret=SUBSTITUA_POR_UM_SEGREDO_ALEATORIO
frontend_origin=http://localhost:3000

# Opcional. Sem a chave, os relatórios usam a análise local determinística.
gemini_api_key=
gemini_model=gemini-3.8-flash
gemini_search_grounding=true

# Open Finance: contract-sandbox funciona sem credenciais externas.
# participant-sandbox exige credenciais emitidas para uma instituição participante.
open_finance_mode=contract-sandbox
open_finance_base_url=
open_finance_access_token=
open_finance_consent_id=
open_finance_institution_id=participant-sandbox
open_finance_key_store_path=
open_finance_key_store_password=

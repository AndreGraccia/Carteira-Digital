name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Empty database for FlywayMigrationsTest: every migration runs from zero on each push.
      postgres:
        image: postgres:14.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      WALLIA_IT_DB_URL: jdbc:postgresql://localhost:5432/postgres
      WALLIA_IT_DB_USER: postgres
      WALLIA_IT_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      # Same major as the production image; compiling on a newer JDK once hid a Java 19 API (ERR-JAVA-015).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B -ntp test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check src
      - run: npm run test:i18n
      - run: CI=true npm test -- --watchAll=false
      - run: npm run build

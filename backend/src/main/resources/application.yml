spring:
  config:
    import: "optional:file:.env.properties,optional:file:../.env.properties"
  application:
    name: e-wallet
  main:
    banner-mode: console
  devtools:
    add-properties: false
  banner:
    location: classpath:/banner.txt
  output:
    ansi:
      enabled: always
  jackson:
    date-format: 'dd.MM.yyyy'
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/${db_name}
    username: ${db_username}
    password: ${db_password}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    placeholderReplacement: false
    baseline-on-migrate: true
  mvc:
    throw-exception-if-no-handler-found: true
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 10MB

logging:
  file:
    name: './logs/application.log'
    logback:
      rollingpolicy:
        max-file-size: 1MB
        total-size-cap: 10MB
        max-history: 30
        clean-history-on-start: true
  pattern:
    console: '%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){blue} %clr(%-5p) %clr(${PID}){faint} %clr(---){faint} %clr([%8.15t]){faint} %clr(%-40.40logger{0}){cyan} %clr(:){faint} %clr(%m){faint}%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
  level:
    com.github.yildizmy: info
    org.springframework: warn
    org.hibernate: error
    org.springframework.security: error

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

exception:
  trace: false

app:
  security:
    jwtSecret: ${jwt_secret}
    jwtExpirationMs: 3600000
    allowedOrigin: ${frontend_origin:http://localhost:3000}
  ai:
    geminiApiKey: ${gemini_api_key:}
    geminiModel: ${gemini_model:gemini-3.8-flash}
    searchGroundingEnabled: ${gemini_search_grounding:true}
    endpoint: https://generativelanguage.googleapis.com/v1beta/interactions
  open-finance:
    mode: ${open_finance_mode:contract-sandbox}
    base-url: ${open_finance_base_url:}
    access-token: ${open_finance_access_token:}
    consent-id: ${open_finance_consent_id:}
    institution-id: ${open_finance_institution_id:participant-sandbox}
    key-store-path: ${open_finance_key_store_path:}
    key-store-password: ${open_finance_key_store_password:}

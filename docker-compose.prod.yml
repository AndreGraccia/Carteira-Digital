name: wallia
services:
  frontend:
    container_name: wallia-frontend
    build: ./frontend
    restart: always
    ports:
      - '${frontend_port:-3001}:3000'
    depends_on:
      - backend
    networks:
      - wallia_network
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '5'

  backend:
    container_name: wallia-backend
    build: ./backend
    env_file: ./.env.properties
    restart: always
    environment:
      SPRING_MAIL_HOST: ${mail_host:-mailpit}
      # Production never stores descriptions in clear text (ADR 0014).
      APP_SECURITY_DATAENCRYPTIONKEY: ${data_encryption_key:?defina data_encryption_key no .env.properties}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${db_name}
      SPRING_DATASOURCE_USERNAME: ${db_username}
      SPRING_DATASOURCE_PASSWORD: ${db_password}
      # nginx in the frontend container proxies to backend:8080, whatever backend_port says.
      SERVER_PORT: 8080
      # API docs stay off in production unless springdoc_enabled=true in .env.properties.
      SPRINGDOC_API_DOCS_ENABLED: ${springdoc_enabled:-false}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${springdoc_enabled:-false}
    ports:
      # Only this machine; the public entry is nginx, so nobody can skip it and spoof X-Forwarded-For.
      - '127.0.0.1:${backend_port:-8082}:8080'
    depends_on:
      - db
    networks:
      - wallia_network
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '5'

networks:
  wallia_network:
    driver: bridge

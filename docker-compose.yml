name: wallia
services:
  db:
    container_name: wallia-db
    image: postgres:14.6-alpine
    restart: always
    env_file: ./.env.properties
    environment:
      POSTGRES_DB: ${db_name}
      POSTGRES_USER: ${db_username}
      POSTGRES_PASSWORD: ${db_password}
    ports:
      # Only this machine reaches the database. Change db_port in .env.properties if 5432 is taken.
      - '127.0.0.1:${db_port:-5432}:5432'
    volumes:
      - wallia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - wallia_network
    expose:
      - 5432
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '5'

  mailpit:
    container_name: wallia-mailpit
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    networks:
      - wallia_network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  wallia_postgres_data:
    # Keeps the database created before the rename (project "e-wallet").
    name: e-wallet_ewallet_postgres_data
    driver: local

networks:
  wallia_network:
    driver: bridge
